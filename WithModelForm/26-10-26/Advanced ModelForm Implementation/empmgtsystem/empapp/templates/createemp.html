<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Employee </title>
    <style>
        .formdiv{
            border: 2px solid black;
            border-radius: 5px;
            padding: 5px;
            width: fit-content;
        }
    </style>
</head>
<body>
    <div class="formdiv">
        <h2>Fill the Employee details</h2>
        <hr>
        <form method="POST" action="{% url 'create'%}">
            {% csrf_token%}
            {{empform.as_p}}
            <input type="submit" value="Create emp">
            <p>{{msg}}</p>
        </form>
    </div>
</body>
</html>
